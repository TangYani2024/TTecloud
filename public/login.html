<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>登录 - 糖糖云盘</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --bgc: #ffffff;
      --tx: #1e293b;
      --cb: rgba(255, 255, 255, 0.65);
      --cd: rgba(0, 0, 0, 0.08);
      --primary: #3b82f6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bgc);
      color: var(--tx);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .c {
      background: var(--cb);
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
      width: 90%;
      max-width: 350px;
      border: 1px solid var(--cd);
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    input, button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid var(--cd);
      background: rgba(0, 0, 0, 0.03);
      color: inherit;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }
    input:focus {
      border-color: #3b82f6;
      background: rgba(0, 0, 0, 0.05);
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
    button:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="bg-layer" id="bg-layer"></div>
  <div class="c">
    <h2 style="margin-top:0;font-size:22px;display:flex;align-items:center;justify-content:center;gap:6px"><img class="om-emoji om-emoji-lg" src="/openmoji/1F510.svg" alt="🔐"> 管理员验证</h2>
    <p style="color:gray;font-size:13px;margin-bottom:20px">需要鉴权以访问核心控制面板</p>
    <form action="/login" method="post">
      <input name="username" placeholder="账号" required autocomplete="username">
      <input type="password" name="password" placeholder="密码" required autocomplete="current-password">
      <button type="submit">登 录</button>
    </form>
    <a href="/" style="display:inline-block;margin-top:15px;font-size:13px;color:gray;text-decoration:none;">&larr; 返回首页</a>
  </div>
  <script>
    (function(){
      try {
        var p = localStorage.getItem('cfg_bgPc') || '';
        var m = localStorage.getItem('cfg_bgMobile') || p;
        var cCache = {};
        function processBg(u, cb) {
          if (!u) return cb(null);
          if (cCache[u]) return cb(cCache[u], true);
          var img = new Image(); img.crossOrigin = 'anonymous';
          img.onload = function() {
            try {
              var w = 360, h = Math.max(1, Math.round(w * (img.naturalHeight / img.naturalWidth || 9/16)));
              var cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h;
              var ctx = cvs.getContext('2d');
              if (ctx) {
                ctx.filter = 'blur(4px) brightness(1.04) saturate(110%)';
                ctx.drawImage(img, 0, 0, w, h);
                var data = cvs.toDataURL('image/jpeg', 0.85);
                cCache[u] = data; return cb(data, true);
              }
            } catch(e) {}
            cb(u, false);
          };
          img.onerror = function() { cb(u, false); };
          img.src = u;
        }
        function syncBg() {
          var isM = window.innerWidth <= 768;
          var u = isM ? (m || p) : (p || m);
          if (u) {
            document.body.style.backgroundColor = 'transparent';
            processBg(u, function(finalUrl, prefiltered) {
              if (!finalUrl) return;
              document.documentElement.style.setProperty('--user-bg-url', 'url("' + finalUrl + '")');
              document.documentElement.style.setProperty('--bg-op', '1');
              var el = document.getElementById('bg-layer');
              if (el) {
                el.style.backgroundImage = 'url("' + finalUrl + '")';
                el.style.opacity = '1';
                if (prefiltered) { el.classList.remove('needs-filter'); el.style.filter = 'none'; }
                else { el.classList.add('needs-filter'); }
              }
            });
          }
        }
        syncBg();
        window.addEventListener('resize', syncBg);
      } catch(e) {}
    })();
  </script>
</body>
</html>
